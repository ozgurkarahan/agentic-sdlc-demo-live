<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo</title>
  </head>
  <body>
    <main>
      <h1>Todo</h1>
      <form id="todo-form">
        <label for="todo-title">Title</label>
        <input id="todo-title" name="title" type="text" autocomplete="off" />
        <button id="add-todo" type="submit">Add</button>
      </form>
      <p id="error-message" role="status" aria-live="polite"></p>
      <ul id="todo-list" aria-live="polite"></ul>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
